services:
  legado-server:
    build: .
    container_name: legado-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      # 必填：JWT 签名密钥（64 位以上随机字符串）。生成：openssl rand -hex 32
      JWT_SECRET: "please-change-me-with-openssl-rand-hex-32"
      # 可选：首次启动的管理员账号（不设则用户名 admin，随机密码打印在日志里）
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ""
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
