# Routine updates for the Web frontend and JVM server only.
# Security updates use GitHub's separate mechanism and PR limits.
version: 2

registries:
  maven-google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/
    password: dummy
    username: dummy
  maven-central:
    type: maven-repository
    url: https://repo1.maven.org/maven2/
    password: dummy
    username: dummy
  maven-jitpack:
    type: maven-repository
    url: https://jitpack.io
    password: dummy
    username: dummy

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    registries: "*"
    open-pull-requests-limit: 3
    # Major JVM toolchain upgrades require a migration PR.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    # Existing version pins require compatibility review before routine upgrades.
    ignore:
      - dependency-name: "cn.hutool:hutool-crypto"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "org.mozilla:rhino"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "org.jsoup:jsoup"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "org.apache.commons:commons-text"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      kotlin-toolchain:
        applies-to: version-updates
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
        update-types: ["minor", "patch"]
      server-libraries:
        applies-to: version-updates
        patterns:
          - "io.ktor:*"
          - "org.jetbrains.exposed:*"
          - "org.xerial:sqlite-jdbc"
          - "com.auth0:java-jwt"
          - "ch.qos.logback:*"
          - "com.github.ben-manes.caffeine:*"
          - "org.jetbrains.kotlinx:*"
          - "com.squareup.okhttp3:*"
          - "com.google.code.gson:*"
          - "com.jayway.jsonpath:*"
          - "cn.wanghaomiao:*"
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Action major versions remain separate for runner compatibility review.
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/modules/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    ignore:
      # This pre-1.0 package can change type-checking behavior on minor releases.
      - dependency-name: "@vue/tsconfig"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      web-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
