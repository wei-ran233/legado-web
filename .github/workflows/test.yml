name: Build Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'modules/engine/**', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', 'Dockerfile', '.github/workflows/test.yml']
  pull_request:
    paths: ['server/**', 'modules/engine/**', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', 'Dockerfile', '.github/workflows/test.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v5
      - name: Test engine and server, and package server
        run: |
          chmod +x gradlew
          ./gradlew :modules:engine:test :server:test :server:installDist --no-daemon
