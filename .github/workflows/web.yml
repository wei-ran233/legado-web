name: Build Web

on:
  push:
    branches: [main]
    paths: ['modules/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['modules/web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        working-directory: modules/web
        run: pnpm install --frozen-lockfile
      - name: Type-check and build Web frontend
        working-directory: modules/web
        run: pnpm build
